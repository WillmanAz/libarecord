<!DOCTYPE html>
<html lang="id" style="visibility:hidden"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Anggota | KIR LIBA MAN 1 Yogyakarta</title><meta name="theme-color" content="#093C5D"><link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:'Raleway',sans-serif}.display{font-family:'Oswald',sans-serif;letter-spacing:.04em}.in{border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem;width:100%;background:#fff}label{font-size:.75rem;display:block;margin-bottom:2px}.btnp{background:#093C5D;color:#fff;border-radius:.5rem;padding:.5rem 1rem}.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}</style></head>
<body data-access="anggota" class="min-h-screen bg-slate-100 text-[#355872]">
<header style="background:linear-gradient(135deg,#093C5D,#355872)" class="text-white">
  <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="display text-xl">KIR LIBA</a>
    <nav class="flex flex-wrap gap-4 text-sm"><a href="kalender.html" class="underline">Kalender</a><a href="prestasi.html" class="underline">Prestasi</a><a href="galeri.html" class="underline">Galeri</a><a href="press.html" class="underline">Press</a><a href="portal.html" class="underline">Portal anggota</a></nav>
  </div>
  <div class="max-w-5xl mx-auto px-4 pb-8 pt-2"><h1 class="display text-3xl sm:text-4xl">Portal Anggota</h1><p class="text-[#93BFCF] mt-1">Pengumuman, jadwal, dan menu anggota</p></div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8"><div id="admin-links" class="hidden mb-4 rounded-xl bg-amber-50 border border-amber-200 p-3 text-sm">Anda BPH: <a href="admin.html" class="underline">Dashboard utama</a> | <a href="admin-organisasi.html" class="underline">Admin organisasi</a></div>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8" id="menu"></div>
<section class="mb-8"><h2 class="display text-2xl text-[#093C5D] mb-3">Pengumuman</h2><div id="ann" class="space-y-3"><p class="text-sm">Memuat...</p></div></section>
<section><h2 class="display text-2xl text-[#093C5D] mb-3">Kegiatan mendatang</h2><div id="upc" class="space-y-3"><p class="text-sm">Memuat...</p></div></section>
<p class="mt-8 text-sm"><button id="logout" class="underline">Keluar</button></p></main>
<footer class="text-center text-xs py-6 text-slate-500">&copy; 2026 KIR LIBA MAN 1 Yogyakarta</footer>
<script type="module">
const $=(id)=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const fmtD=(ts,o)=>ts?ts.toDate().toLocaleDateString("id-ID",o||{day:"numeric",month:"long",year:"numeric"}):"";
const safeUrl=(u)=>(/^https?:\/\//i.test(u)?u:"#");
import { db } from "./js/firebase-config.js";
import { guardPage, logout } from "./js/auth.js";
import { collection, query, orderBy, limit, where, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const { user, role } = await guardPage("anggota");
$("logout").onclick = logout;
if (role === "bph") $("admin-links").classList.remove("hidden");
document.querySelector("header h1").textContent = "Halo, " + (user.displayName || user.email.split("@")[0]);
[["Arsip karya","arsip.html"],["Presensi QR","presensi.html"],["Akun & karya saya","akun.html"],["Kalender","kalender.html"]].forEach(([t,h])=>{const a=el("a","block bg-white rounded-xl shadow p-4 text-center font-medium text-[#093C5D] hover:shadow-md",t);a.href=h;$("menu").append(a);});
try {
  const s = await getDocs(query(collection(db,"pengumuman"),orderBy("createdAt","desc"),limit(10)));
  const rows = s.docs.map(d=>d.data()).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  $("ann").replaceChildren();
  if(!rows.length) $("ann").append(el("p","text-sm","Belum ada pengumuman."));
  rows.forEach(x=>{const c=el("article","bg-white rounded-xl shadow p-4"+(x.pinned?" border-l-4 border-[#093C5D]":""));c.append(el("h3","font-semibold text-[#093C5D]",(x.pinned?"[Disematkan] ":"")+x.title),el("p","text-xs mb-1",fmtD(x.createdAt)),el("p","text-sm whitespace-pre-line",x.body));$("ann").append(c);});
} catch(e) { console.error(e); $("ann").textContent = "Pengumuman belum dapat dimuat."; }
try {
  const t = new Date(); t.setHours(0,0,0,0);
  const s = await getDocs(query(collection(db,"kegiatan"),where("date",">=",Timestamp.fromDate(t)),orderBy("date"),limit(4)));
  $("upc").replaceChildren();
  if(s.empty) $("upc").append(el("p","text-sm","Belum ada kegiatan terjadwal."));
  s.forEach(d=>{const x=d.data();const c=el("div","bg-white rounded-xl shadow p-4");c.append(el("div","font-semibold text-[#093C5D]",x.title),el("div","text-xs",[fmtD(x.date,{weekday:"long",day:"numeric",month:"long"}),x.time,x.place].filter(Boolean).join(" | ")));$("upc").append(c);});
} catch(e) { console.error(e); $("upc").textContent = "Kegiatan belum dapat dimuat."; }

</script></body></html>
