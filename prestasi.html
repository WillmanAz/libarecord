<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestasi | KIR LIBA MAN 1 Yogyakarta</title><meta name="theme-color" content="#093C5D"><link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:'Raleway',sans-serif}.display{font-family:'Oswald',sans-serif;letter-spacing:.04em}.in{border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem;width:100%;background:#fff}label{font-size:.75rem;display:block;margin-bottom:2px}.btnp{background:#093C5D;color:#fff;border-radius:.5rem;padding:.5rem 1rem}.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-[#355872]">
<header style="background:linear-gradient(135deg,#093C5D,#355872)" class="text-white">
  <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="display text-xl">KIR LIBA</a>
    <nav class="flex flex-wrap gap-4 text-sm"><a href="kalender.html" class="underline">Kalender</a><a href="prestasi.html" class="underline">Prestasi</a><a href="galeri.html" class="underline">Galeri</a><a href="press.html" class="underline">Press</a><a href="portal.html" class="underline">Portal anggota</a></nav>
  </div>
  <div class="max-w-5xl mx-auto px-4 pb-8 pt-2"><h1 class="display text-3xl sm:text-4xl">Prestasi KIR LIBA</h1><p class="text-[#93BFCF] mt-1">Hall of fame juara dan finalis dari tahun ke tahun</p></div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8"><input id="q" placeholder="Cari lomba atau nama" class="in mb-6"><div id="list" class="space-y-8"></div></main>
<footer class="text-center text-xs py-6 text-slate-500">&copy; 2026 KIR LIBA MAN 1 Yogyakarta</footer>
<script type="module">
const $=(id)=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const fmtD=(ts,o)=>ts?ts.toDate().toLocaleDateString("id-ID",o||{day:"numeric",month:"long",year:"numeric"}):"";
const safeUrl=(u)=>(/^https?:\/\//i.test(u)?u:"#");
import { db } from "./js/firebase-config.js";
import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let rows = [];
try { const s = await getDocs(query(collection(db,"prestasi"),orderBy("year","desc"),limit(300))); rows = s.docs.map(d=>d.data()); } catch(e) { console.error(e); }
const LVL = { Internasional:"bg-rose-100 text-rose-800", Nasional:"bg-amber-100 text-amber-800", Provinsi:"bg-sky-100 text-sky-800" };
function render() {
  const q = $("q").value.toLowerCase(), list = $("list"); list.replaceChildren();
  const f = rows.filter(x=>!q||`${x.title} ${x.name} ${x.achievement}`.toLowerCase().includes(q));
  if (!f.length) return list.append(el("p","text-sm","Belum ada data prestasi."));
  const by = new Map(); f.forEach(x=>{ if(!by.has(x.year)) by.set(x.year,[]); by.get(x.year).push(x); });
  for (const [year, items] of by) {
    const sec = el("section"); sec.append(el("h2","display text-2xl text-[#093C5D] mb-3",String(year)));
    const g = el("div","grid sm:grid-cols-2 gap-3");
    items.forEach(x=>{ const c = el("article","bg-white rounded-xl shadow p-4");
      c.append(el("div","text-xs font-semibold inline-block rounded-full px-2 py-0.5 "+(LVL[x.level]||"bg-slate-100 text-slate-700"),x.level||"Prestasi"), el("h3","font-semibold text-[#093C5D] mt-1",x.achievement), el("p","text-sm",x.title), el("p","text-sm font-medium mt-1",x.name));
      if (x.description) c.append(el("p","text-xs mt-1",x.description)); g.append(c); });
    sec.append(g); list.append(sec);
  }
}
$("q").addEventListener("input", render); render();

</script></body></html>
