<!DOCTYPE html>
<html lang="id" style="visibility:hidden"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="icon" type="image/png" href="img/favicon.png"><title>Dashboard Admin | KIR LIBA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body data-access="bph" class="bg-slate-100 p-4 sm:p-8">
<div class="max-w-5xl mx-auto space-y-6">
  <header class="flex justify-between items-center"><h1 class="text-2xl font-semibold text-[#093C5D]">Dashboard BPH</h1>
    <nav class="flex gap-4 text-sm"><a href="index.html" class="underline">Beranda</a><a href="arsip.html" class="underline">Arsip</a><button id="logout" class="underline">Keluar</button></nav></header>

  <section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-semibold mb-3">Verifikasi pendaftar</h2>
    <table class="w-full text-sm"><thead><tr class="text-left"><th>Nama</th><th>Email</th><th>Aksi</th></tr></thead><tbody id="pending-body"></tbody></table></section>

  <section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-semibold mb-3">Press release</h2>
    <form id="press-form" class="grid gap-2 mb-4">
      <input name="title" required placeholder="Judul" class="border rounded p-2">
      <input name="excerpt" placeholder="Ringkasan singkat" class="border rounded p-2">
      <textarea name="content" required rows="4" placeholder="Isi" class="border rounded p-2"></textarea>
      <input name="coverUrl" placeholder="URL gambar sampul (opsional)" class="border rounded p-2">
      <button class="bg-[#093C5D] text-white rounded py-2">Terbitkan</button></form>
    <table class="w-full text-sm"><tbody id="press-body"></tbody></table></section>

  <section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-semibold mb-3">Tambah karya ilmiah</h2>
    <form id="karya-form" class="grid sm:grid-cols-2 gap-2">
      <input name="title" required placeholder="Judul" class="border rounded p-2 sm:col-span-2">
      <input name="authors" required placeholder="Penulis (pisahkan dengan koma)" class="border rounded p-2">
      <input name="year" type="number" required placeholder="Tahun" class="border rounded p-2">
      <input name="category" required placeholder="Kategori" class="border rounded p-2">
      <input name="fileUrl" required placeholder="Link file (https://...)" class="border rounded p-2">
      <textarea name="abstract" rows="3" placeholder="Abstrak" class="border rounded p-2 sm:col-span-2"></textarea>
      <button class="bg-[#093C5D] text-white rounded py-2 sm:col-span-2">Simpan karya</button></form></section>

  <section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-semibold mb-3">Buat URL pendek</h2>
    <form id="short-form" class="grid sm:grid-cols-3 gap-2">
      <input name="targetUrl" required placeholder="URL tujuan (https://...)" class="border rounded p-2 sm:col-span-2">
      <input name="slug" placeholder="Slug (opsional)" class="border rounded p-2">
      <button class="bg-[#093C5D] text-white rounded py-2 sm:col-span-3">Buat tautan</button></form>
    <p id="short-result" class="mt-3 font-mono text-sm break-all"></p></section>

  <section class="bg-white rounded-xl p-5 shadow-sm"><h2 class="font-semibold mb-3">Presensi QR</h2>
    <form id="qr-form" class="grid sm:grid-cols-3 gap-2 mb-4">
      <input name="title" required placeholder="Nama kegiatan" class="border rounded p-2 sm:col-span-2">
      <select name="minutes" class="border rounded p-2"><option value="15">Berlaku 15 menit</option><option value="30">30 menit</option><option value="60" selected>60 menit</option><option value="180">3 jam</option></select>
      <button class="bg-[#093C5D] text-white rounded py-2 sm:col-span-3">Buat sesi dan QR</button></form>
    <div class="grid sm:grid-cols-2 gap-6">
      <div><p id="qr-title" class="font-medium mb-2"></p><div id="qr-box"></div></div>
      <div><table class="w-full text-sm"><thead><tr class="text-left"><th>Sesi</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="sesi-body"></tbody></table>
        <p id="hadir-title" class="font-medium mt-4"></p><ul id="hadir-list" class="list-disc ml-5 text-sm"></ul></div></div></section>
</div>
<script type="module">
  import { guardPage, logout } from "./js/auth.js";
  import { initAdmin } from "./js/admin.js";
  await guardPage("bph");
  document.getElementById("logout").onclick = logout;
  initAdmin();
</script></body></html>
