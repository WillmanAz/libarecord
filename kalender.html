<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender Kegiatan | KIR LIBA MAN 1 Yogyakarta</title><meta name="theme-color" content="#093C5D"><link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:'Raleway',sans-serif}.display{font-family:'Oswald',sans-serif;letter-spacing:.04em}.in{border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem;width:100%;background:#fff}label{font-size:.75rem;display:block;margin-bottom:2px}.btnp{background:#093C5D;color:#fff;border-radius:.5rem;padding:.5rem 1rem}.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-[#355872]">
<header style="background:linear-gradient(135deg,#093C5D,#355872)" class="text-white">
  <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="display text-xl">KIR LIBA</a>
    <nav class="flex flex-wrap gap-4 text-sm"><a href="kalender.html" class="underline">Kalender</a><a href="prestasi.html" class="underline">Prestasi</a><a href="galeri.html" class="underline">Galeri</a><a href="press.html" class="underline">Press</a><a href="portal.html" class="underline">Portal anggota</a></nav>
  </div>
  <div class="max-w-5xl mx-auto px-4 pb-8 pt-2"><h1 class="display text-3xl sm:text-4xl">Kalender Kegiatan</h1><p class="text-[#93BFCF] mt-1">Jadwal Latihan Rutin dan Program Kerja</p></div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8"><div class="flex items-center justify-between mb-4"><button id="prev" class="btnp">&lsaquo;</button><h2 id="mlabel" class="display text-2xl text-[#093C5D]"></h2><button id="next" class="btnp">&rsaquo;</button></div>
<div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold mb-1"><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div><div>Min</div></div>
<div id="grid" class="grid grid-cols-7 gap-1 mb-8"></div>
<div id="list" class="space-y-3"></div></main>
<footer class="text-center text-xs py-6 text-slate-500">&copy; 2026 KIR LIBA MAN 1 Yogyakarta</footer>
<script type="module">
const $=(id)=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const fmtD=(ts,o)=>ts?ts.toDate().toLocaleDateString("id-ID",o||{day:"numeric",month:"long",year:"numeric"}):"";
const safeUrl=(u)=>(/^https?:\/\//i.test(u)?u:"#");
import { db } from "./js/firebase-config.js";
import { collection, query, where, orderBy, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const COLOR = { Larut:"bg-sky-500", Rapat:"bg-slate-500", Lomba:"bg-amber-500", OPREC:"bg-emerald-500", Lainnya:"bg-violet-500" };
let cur = new Date(); cur.setDate(1);
async function render() {
  const y = cur.getFullYear(), m = cur.getMonth();
  $("mlabel").textContent = cur.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  let items = [];
  try {
    const s = await getDocs(query(collection(db,"kegiatan"),where("date",">=",Timestamp.fromDate(new Date(y,m,1))),where("date","<",Timestamp.fromDate(new Date(y,m+1,1))),orderBy("date")));
    items = s.docs.map(d=>({id:d.id,...d.data()}));
  } catch(e) { console.error(e); }
  const grid = $("grid"); grid.replaceChildren();
  const offset = (new Date(y,m,1).getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  for (let i=0;i<offset;i++) grid.append(el("div"));
  for (let d=1; d<=days; d++) {
    const c = el("div","bg-white rounded-lg min-h-16 p-1 text-left"); c.append(el("div","text-xs font-semibold",String(d)));
    const dots = el("div","flex flex-wrap gap-0.5 mt-1");
    items.filter(x=>x.date.toDate().getDate()===d).forEach(x=>{const dot=el("span","h-2 w-2 rounded-full "+(COLOR[x.type]||COLOR.Lainnya));dot.title=x.title;dots.append(dot);});
    c.append(dots); grid.append(c);
  }
  const list = $("list"); list.replaceChildren();
  if (!items.length) list.append(el("p","text-sm","Belum ada kegiatan bulan ini."));
  items.forEach(x=>{
    const c = el("article","bg-white rounded-xl shadow p-4 flex gap-3 items-start");
    c.append(el("span","mt-1.5 h-3 w-3 rounded-full shrink-0 "+(COLOR[x.type]||COLOR.Lainnya)));
    const b = el("div","flex-1"); b.append(el("h3","font-semibold text-[#093C5D]",x.title), el("p","text-xs",[fmtD(x.date,{weekday:"long",day:"numeric",month:"long"}),x.time,x.place,x.type].filter(Boolean).join(" | ")));
    if (x.description) b.append(el("p","text-sm mt-1 whitespace-pre-line",x.description));
    c.append(b);
    if (x.registerOpen) { const a = el("a","btnp text-sm self-center","Daftar"); a.href = "daftar.html?event=" + encodeURIComponent(x.id); c.append(a); }
    list.append(c);
  });
}
$("prev").onclick = () => { cur.setMonth(cur.getMonth()-1); render(); };
$("next").onclick = () => { cur.setMonth(cur.getMonth()+1); render(); };
render();

</script></body></html>
