<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="icon" type="image/png" href="img/favicon.png"><title>Masuk | KIR LIBA MAN 1 Yogyakarta</title></head>
<body class="min-h-screen bg-gradient-to-br from-[#093C5D] to-[#355872] flex items-center justify-center p-4">
<main class="bg-white/95 rounded-2xl shadow-xl w-full max-w-md p-8">
  <a href="index.html" class="text-sm text-[#355872] underline">Kembali ke beranda</a>
  <h1 class="text-2xl font-semibold text-[#093C5D] mt-3 mb-5">Portal anggota KIR LIBA</h1>
  <div class="flex mb-5 border-b border-[#93BFCF]">
    <button id="tab-login" class="flex-1 py-2 font-medium border-b-2 border-[#093C5D] text-[#093C5D]">Masuk</button>
    <button id="tab-register" class="flex-1 py-2 font-medium text-[#355872]">Daftar</button>
  </div>
  <button type="button" id="google" class="w-full flex items-center justify-center gap-3 border border-slate-300 bg-white rounded-lg py-3 font-medium text-slate-700 hover:bg-slate-50">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Lanjutkan dengan Google</button>
  <div class="flex items-center gap-3 my-4 text-xs text-slate-400"><span class="flex-1 border-t"></span>atau dengan email<span class="flex-1 border-t"></span></div>
  <form id="login-form" class="space-y-3">
    <input name="email" type="email" required placeholder="Email" class="w-full border rounded-lg p-3">
    <input name="password" type="password" required placeholder="Kata sandi" class="w-full border rounded-lg p-3">
    <button class="w-full bg-[#093C5D] text-white rounded-lg py-3 font-medium">Masuk</button>
    <button type="button" id="forgot" class="text-sm underline text-[#355872]">Lupa kata sandi?</button>
  </form>
  <form id="register-form" class="space-y-3 hidden">
    <input name="name" required placeholder="Nama lengkap" class="w-full border rounded-lg p-3">
    <input name="email" type="email" required placeholder="Email" class="w-full border rounded-lg p-3">
    <input name="password" type="password" required minlength="8" placeholder="Kata sandi (min. 8 karakter)" class="w-full border rounded-lg p-3">
    <button class="w-full bg-[#093C5D] text-white rounded-lg py-3 font-medium">Daftar</button>
    <p class="text-xs text-[#355872]">Akun baru perlu diverifikasi BPH sebelum bisa membuka arsip dan presensi.</p>
  </form>
  <p id="error" class="mt-4 text-sm text-red-700"></p>
</main>
<script type="module">
  import { login, register, resetPassword, loginWithGoogle } from "./js/auth.js";
  const $ = (id) => document.getElementById(id);
  const err = $("error");
  const msgs = {
    "auth/invalid-credential": "Email atau kata sandi salah.",
    "auth/email-already-in-use": "Email sudah terdaftar. Silakan masuk.",
    "auth/weak-password": "Kata sandi minimal 8 karakter.",
    "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi nanti.",
    "auth/popup-closed-by-user": "Jendela Google ditutup sebelum selesai.",
    "auth/cancelled-popup-request": "",
    "auth/popup-blocked": "Pop-up diblokir browser. Izinkan pop-up untuk situs ini lalu coba lagi.",
    "auth/unauthorized-domain": "Domain situs ini belum didaftarkan di Firebase (Authentication > Settings > Authorized domains).",
    "auth/operation-not-allowed": "Login Google belum diaktifkan di Firebase Console.",
    "auth/invalid-email": "Format email tidak valid."
  };
  function show(which) {
    $("login-form").classList.toggle("hidden", which !== "login");
    $("register-form").classList.toggle("hidden", which !== "register");
    $("tab-login").className = "flex-1 py-2 font-medium " + (which === "login" ? "border-b-2 border-[#093C5D] text-[#093C5D]" : "text-[#355872]");
    $("tab-register").className = "flex-1 py-2 font-medium " + (which === "register" ? "border-b-2 border-[#093C5D] text-[#093C5D]" : "text-[#355872]");
    err.textContent = "";
  }
  $("tab-login").onclick = () => show("login");
  $("tab-register").onclick = () => show("register");
  $("forgot").onclick = async () => {
    const email = document.querySelector("#login-form [name=email]").value.trim();
    if (!email) { err.className = "mt-4 text-sm text-red-700"; err.textContent = "Isi email di kolom atas dulu, lalu klik Lupa kata sandi."; return; }
    try {
      await resetPassword(email);
      err.className = "mt-4 text-sm text-green-700";
      err.textContent = "Jika email terdaftar, tautan reset kata sandi sudah dikirim. Cek juga folder Spam.";
    } catch (e) { err.className = "mt-4 text-sm text-red-700"; err.textContent = msgs[e.code] || "Gagal: " + e.message; }
  };
  async function run(fn) {
    err.className = "mt-4 text-sm text-red-700"; err.textContent = "";
    try { await fn(); } catch (e) { err.textContent = msgs[e.code] || "Gagal: " + e.message; }
  }
  $("google").onclick = () => run(() => loginWithGoogle());
  $("login-form").addEventListener("submit", (e) => { e.preventDefault(); const f = e.target; run(() => login(f.email.value, f.password.value)); });
  $("register-form").addEventListener("submit", (e) => { e.preventDefault(); const f = e.target; run(() => register(f.name.value.trim(), f.email.value, f.password.value)); });
</script></body></html>
