<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran | KIR LIBA MAN 1 Yogyakarta</title><meta name="theme-color" content="#093C5D"><link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:'Raleway',sans-serif}.display{font-family:'Oswald',sans-serif;letter-spacing:.04em}.in{border:1px solid #cbd5e1;border-radius:.5rem;padding:.5rem;width:100%;background:#fff}label{font-size:.75rem;display:block;margin-bottom:2px}.btnp{background:#093C5D;color:#fff;border-radius:.5rem;padding:.5rem 1rem}.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}</style></head>
<body class="min-h-screen bg-slate-100 text-[#355872]">
<header style="background:linear-gradient(135deg,#093C5D,#355872)" class="text-white">
  <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="display text-xl">KIR LIBA</a>
    <nav class="flex flex-wrap gap-4 text-sm"><a href="kalender.html" class="underline">Kalender</a><a href="prestasi.html" class="underline">Prestasi</a><a href="galeri.html" class="underline">Galeri</a><a href="press.html" class="underline">Press</a><a href="portal.html" class="underline">Portal anggota</a></nav>
  </div>
  <div class="max-w-5xl mx-auto px-4 pb-8 pt-2"><h1 class="display text-3xl sm:text-4xl">Pendaftaran Kegiatan</h1><p class="text-[#93BFCF] mt-1">Isi data dengan benar. Satu email untuk satu kegiatan.</p></div>
</header>
<main class="max-w-5xl mx-auto px-4 py-8"><div id="box" class="max-w-lg mx-auto bg-white rounded-2xl shadow p-6"><p>Memuat...</p></div></main>
<footer class="text-center text-xs py-6 text-slate-500">&copy; 2026 KIR LIBA MAN 1 Yogyakarta</footer>
<script type="module">
const $=(id)=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const fmtD=(ts,o)=>ts?ts.toDate().toLocaleDateString("id-ID",o||{day:"numeric",month:"long",year:"numeric"}):"";
const safeUrl=(u)=>(/^https?:\/\//i.test(u)?u:"#");
import { db } from "./js/firebase-config.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const box = $("box"), id = new URLSearchParams(location.search).get("event");
const closed = (m) => box.replaceChildren(el("p","",m));
(async () => {
try {
  if (!id || !/^[A-Za-z0-9]{10,40}$/.test(id)) throw 0;
  const snap = await getDoc(doc(db,"kegiatan",id));
  if (!snap.exists() || !snap.data().registerOpen) return closed("Pendaftaran untuk kegiatan ini tidak ditemukan atau sudah ditutup.");
  const ev = snap.data(); document.querySelector("header h1").textContent = ev.title;
  box.innerHTML = `<form id="f" class="grid gap-3"><div><label>Nama lengkap</label><input name="name" required minlength="2" maxlength="80" class="in"></div><div><label>Email</label><input name="email" type="email" required maxlength="100" class="in"></div><div><label>No. HP/WhatsApp</label><input name="phone" maxlength="20" class="in"></div><div><label>Asal sekolah / kelas</label><input name="school" maxlength="80" class="in"></div><div><label>Catatan (opsional)</label><textarea name="note" maxlength="300" rows="2" class="in"></textarea></div><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><button class="btnp">Kirim pendaftaran</button><p id="msg" class="text-sm"></p></form>`;
  $("f").addEventListener("submit", async (e) => { e.preventDefault(); const f = e.target;
    if (f.website.value) return closed("Pendaftaran terkirim. Terima kasih!");
    const email = f.email.value.trim();
    if (/[\/\s]/.test(email)) return ($("msg").textContent = "Format email tidak valid.");
    f.querySelector("button").disabled = true;
    try {
      await setDoc(doc(db,"registrations", id + "_" + email.toLowerCase()), { event:id, eventTitle: ev.title.slice(0,120), name:f.name.value.trim(), email, phone:f.phone.value.trim(), school:f.school.value.trim(), note:f.note.value.trim(), createdAt: serverTimestamp() });
      closed("Pendaftaran terkirim. Terima kasih! Pantau info selanjutnya lewat Instagram @libascienceclub.");
    } catch(err) { $("msg").textContent = "Gagal: email ini sudah terdaftar di kegiatan ini, atau pendaftaran sudah ditutup."; f.querySelector("button").disabled = false; } });
} catch(e) { closed("Kegiatan tidak ditemukan."); }
})();
</script></body></html>
