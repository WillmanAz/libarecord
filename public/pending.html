<!DOCTYPE html>
<html lang="id" style="visibility:hidden"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.tailwindcss.com"></script><link rel="icon" type="image/png" href="img/favicon.png"><title>Menunggu verifikasi | KIR LIBA</title></head>
<body data-access="auth" class="min-h-screen bg-gradient-to-br from-[#093C5D] to-[#355872] flex items-center justify-center p-4">
<main class="bg-white/95 rounded-2xl shadow-xl w-full max-w-md p-8 text-center">
  <h1 id="title" class="text-2xl font-semibold text-[#093C5D] mb-3"></h1>
  <p id="desc" class="text-[#355872] mb-6"></p>
  <div class="flex gap-3 justify-center">
    <a href="index.html" class="px-4 py-2 rounded-lg border border-[#093C5D] text-[#093C5D]">Beranda</a>
    <button id="logout" class="px-4 py-2 rounded-lg bg-[#093C5D] text-white">Keluar</button>
  </div>
</main>
<script type="module">
  import { guardPage, logout } from "./js/auth.js";
  const { role } = await guardPage();
  if (role === "anggota" || role === "bph") location.replace(role === "bph" ? "admin.html" : "arsip.html");
  const rejected = role === "rejected";
  document.getElementById("title").textContent = rejected ? "Pendaftaran tidak disetujui" : "Menunggu verifikasi BPH";
  document.getElementById("desc").textContent = rejected
    ? "Hubungi BPH KIR LIBA jika kamu merasa ini keliru."
    : "Akunmu sudah terdaftar. Setelah BPH memverifikasi, kamu bisa membuka arsip karya ilmiah dan presensi.";
  document.getElementById("logout").onclick = logout;
</script></body></html>
